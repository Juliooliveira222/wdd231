<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Obrigado</title>

    <link rel="stylesheet" href="estilos/associacao.css">

    <script src="scripts/agradecimento.js" defer></script>
</head>
<body>

<header>
    <h1>Obrigado por sua inscrição</h1>
</header>

<main class="form-section">

    <h2>Dados enviados</h2>

    <p><strong>Nome:</strong>
    <span id="fname"></span>
</p>

<p><strong>Sobrenome:</strong>
    <span id="lname"></span>
</p>

<p><strong>E-mail:</strong>
    <span id="email"></span>
</p>

<p><strong>Telefone:</strong>
    <span id="phone"></span>
</p>

<p><strong>Empresa:</strong>
    <span id="organization"></span>
</p>

<p><strong>Data de envio:</strong>
    <span id="timestamp"></span>
</p>

</main>

</body>
</html>
